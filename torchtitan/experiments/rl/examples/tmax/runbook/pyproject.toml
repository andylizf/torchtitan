[tool.uv]
# Only ever resolve for the platform the pins came from.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# torch/vllm nightlies and PyPI both carry some of these names; prefer whichever
# index has the exact pinned version rather than failing on the first index.
index-strategy = "unsafe-best-match"
# WHY EVERY VERSION IS ALSO AN OVERRIDE.
#
# The live environment does not satisfy its own packages' declared metadata. It
# was built by successive `pip install`s where a later install overwrote a
# transitive pin an earlier package had asked for, and pip never re-checked.
# uv's resolver does check, so a plain `uv lock` fails. Real violations found,
# each one a package whose declared requirement the installed set contradicts:
#
#   torchstore @5a4d5d3  requires torchmonarch==0.4.1   installed: 0.6.0
#   torchstore @5a4d5d3  requires torch==2.11.0 (cu130) installed: 2.14.0.dev20260806+cu130
#   vllm 1.0.0.dev...    requires tilelang==0.1.12      installed: 0.1.13
#   vllm 1.0.0.dev...    requires apache-tvm-ffi==0.1.12 (satisfied, listed for completeness)
#   datasets 4.7.0       requires fsspec<=2026.2.0      installed: 2026.7.0
#   datasets 4.7.0       requires dill<0.4.1            installed: 0.4.1
#   (and further conflicts behind these -- the list stopped being enumerated
#   once it was clear the pattern was systemic, not a handful of exceptions)
#
# So `override-dependencies` restates every pin from requirements.lock.txt. That
# makes the resolve trivially succeed and makes `uv sync` reproduce the exact
# venv we ran -- which is the point. What it does NOT do is prove the set is
# self-consistent: it is not, and the overrides are what suppress the errors.
#
# Read this honestly: this lock reproduces a known-working environment, it does
# not certify a sound one. It ran a 150-step 9B job, so the violations above are
# evidently tolerable in practice; none of them has been shown to be harmless in
# principle. If you hit a runtime error that smells like an ABI or API mismatch,
# this block is the first place to look, not the last.
