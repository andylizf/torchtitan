# uv/PEP-621 project describing the exact environment of the reference 9B run.
#
# This exists so `uv lock` / `uv sync` can rebuild the venv. It is a description of
# an environment that was assembled incrementally on a live box, not a hand-authored
# dependency set: every version below is pinned to what actually ran, including
# transitive packages. Loosening any pin means you are no longer running our build.
#
# torchtitan is intentionally NOT a dependency. Put the checkout on PYTHONPATH.
#
# Resolution is restricted to the one platform this was captured on. Many of these
# wheels (the nvidia-*, vllm, flash-attn, triton builds) exist only for
# linux/x86_64/cp312, so an unrestricted resolve cannot succeed and should not be
# attempted -- see RUNBOOK.md section B.

[project]
name = "terminalworld-rl-env"
version = "0.0.0"
description = "Pinned environment for the TerminalWorld 9B RL run (torchtitan experiments/rl)"
